name: Build

on:
  push:
    branches: [ "knime" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Unlike ci.yml this builds the real artifacts, so it needs the pinned bundle cache too.
      - name: Setup Eclipse SDK
        id: eclipse
        uses: ./.github/actions/setup-eclipse-sdk
        with:
          pinned-bundles: 'true'

      # cn.varsa:cli-core resolves from GitHub Packages, whose credentials fall back to
      # GITHUB_ACTOR/GITHUB_TOKEN (see githubPackagesUsername/Password in build.gradle.kts).
      # Without them the repository 401s. ci.yml and release.yml already set these.
      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: ./gradlew build -PeclipseSdk=${{ steps.eclipse.outputs.sdk-path }}
