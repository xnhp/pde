name: Build

on:
  push:
    branches: [ "knime" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Unlike ci.yml this builds the real artifacts, so it needs the pinned bundle cache too.
      - name: Setup Eclipse SDK
        id: eclipse
        uses: ./.github/actions/setup-eclipse-sdk
        with:
          pinned-bundles: 'true'

      - name: Build
        run: ./gradlew build -PeclipseSdk=${{ steps.eclipse.outputs.sdk-path }}
