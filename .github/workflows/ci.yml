name: CI

on:
  push:
    branches: [ "knime" ]
  pull_request:
    branches: [ "knime" ]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # tools/*/src compiles against a fileTree of the SDK's plugins/, so even a test-only
      # build needs the SDK -- but not the pinned bundle cache, which -PskipEclipseRuntimes
      # takes out of the picture along with the p2.director runs.
      - name: Setup Eclipse SDK
        id: eclipse
        uses: ./.github/actions/setup-eclipse-sdk

      - name: Run unit tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: ./gradlew check -PeclipseSdk=${{ steps.eclipse.outputs.sdk-path }} -PskipEclipseRuntimes=true
